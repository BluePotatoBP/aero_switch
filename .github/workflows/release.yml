name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build (compiles main, runs unit tests)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
        shell: bash

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          cp build/libs/aero-switch-*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist
        shell: bash

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar
          generate_release_notes: true
